name: Build Win Music APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Compiler Win Music
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: echo y | buildozer -v android debug
          buildozer_version: stable

      - name: Enregistrer le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: WinMusic-apk
          path: ${{ steps.buildozer.outputs.filename }}
